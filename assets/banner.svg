<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: #080b14; border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="grid-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="splat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#080b14" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes orbitMesh {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .particle-delayed { animation: floatParticle 8s ease-in-out 2s infinite; }
    .particle-slow { animation: floatParticle 10s ease-in-out 4s infinite; }
    .splat-pulse { animation: pulse 7s ease-in-out infinite; transform-origin: 980px 170px; }
    .orbit-ring { animation: orbitMesh 24s linear infinite; transform-origin: 980px 170px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#grad-bg)" />

  <!-- Perspective Mesh Grid (3D Depth) -->
  <g stroke="url(#grid-line)" stroke-width="1">
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="285" x2="1200" y2="285" />
    <line x1="0" y1="310" x2="1200" y2="310" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="100" y1="340" x2="450" y2="240" />
    <line x1="300" y1="340" x2="520" y2="240" />
    <line x1="500" y1="340" x2="590" y2="240" />
    <line x1="700" y1="340" x2="660" y2="240" />
    <line x1="900" y1="340" x2="730" y2="240" />
    <line x1="1100" y1="340" x2="800" y2="240" />
  </g>

  <!-- Ambient Glow Behind Graphics -->
  <circle cx="980" cy="170" r="140" fill="url(#splat-glow)" />
  <circle cx="150" cy="60" r="100" fill="url(#splat-glow)" opacity="0.5" />

  <!-- Dynamic 3D Splatting Coordinate Sphere on the Right -->
  <g class="orbit-ring">
    <ellipse cx="980" cy="170" rx="110" ry="38" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <ellipse cx="980" cy="170" rx="38" ry="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" />
    <circle cx="980" cy="170" r="85" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.3" />
  </g>

  <!-- 3D Gaussian Splat Ellipsoids (Animated Pulsing) -->
  <g class="splat-pulse">
    <ellipse cx="980" cy="170" rx="60" ry="25" fill="#38bdf8" opacity="0.25" transform="rotate(-25 980 170)" />
    <ellipse cx="980" cy="170" rx="45" ry="18" fill="#a855f7" opacity="0.4" transform="rotate(35 980 170)" />
    <ellipse cx="980" cy="170" rx="25" ry="12" fill="#f43f5e" opacity="0.55" transform="rotate(-10 980 170)" />
    <circle cx="980" cy="170" r="6" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Floating Splat Particles -->
  <circle class="particle" cx="910" cy="120" r="3.5" fill="#38bdf8" />
  <circle class="particle-delayed" cx="1050" cy="130" r="4" fill="#f43f5e" />
  <circle class="particle-slow" cx="940" cy="225" r="3" fill="#a855f7" />
  <circle class="particle" cx="1030" cy="210" r="2.5" fill="#38bdf8" />
  <circle class="particle-delayed" cx="870" cy="170" r="3" fill="#f43f5e" />
  <circle class="particle-slow" cx="1080" cy="180" r="2.5" fill="#c084fc" />

  <!-- Left Header Badges & Branding (Strictly Foreground) -->
  <g transform="translate(60, 48)">
    <!-- Category Tag Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="4.5" fill="#22c55e" />
    <text x="26" y="18" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.2">3D VISION • NERF • 3DGS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#grad-title)" font-size="36" font-weight="800" letter-spacing="-0.5">
      Neural Radiance Fields &amp; 3DGS
    </text>
    <text x="0" y="116" fill="#f8fafc" font-size="22" font-weight="600" letter-spacing="-0.2">
      Curated 3D Reconstruction Platforms &amp; Open-Source Projects
    </text>

    <!-- Subtitle Details -->
    <text x="0" y="150" fill="#94a3b8" font-size="14" font-weight="400">
      ⚡ 3D Gaussian Splatting (3DGS) • NeRFs • Structure-from-Motion • WebGPU Splat Viewers
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 180)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="16" y="20" fill="#38bdf8" font-size="12" font-weight="600">🚀 Top SaaS Tools</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="146" height="32" rx="8" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
      <text x="158" y="20" fill="#c084fc" font-size="12" font-weight="600">⭐ GitHub Repos</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="158" height="32" rx="8" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />
      <text x="314" y="20" fill="#fb7185" font-size="12" font-weight="600">📊 Pricing &amp; Metrics</text>

      <!-- Pill 4 -->
      <rect x="470" y="0" width="138" height="32" rx="8" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1" />
      <text x="484" y="20" fill="#4ade80" font-size="12" font-weight="600">🌐 Live Viewers</text>
    </g>
  </g>
</svg>
